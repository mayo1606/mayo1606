name: Character browser diagnostics
on:
  push:
    branches: [chatgpt/character-fixes-v2]
concurrency:
  group: character-qa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply inspected material and skeletal fixes
        run: |
          python3 qa/piccolo-material-fix.py
          python3 qa/apply-character-fix.py
      - name: Install pinned test dependencies
        run: |
          mkdir -p /tmp/character-qa
          npm install --prefix /tmp/character-qa playwright@1.55.0 three@0.128.0
          cd /tmp/character-qa
          npx playwright install --with-deps chromium
      - name: Test characters in Chromium WebGL
        run: |
          ln -s /tmp/character-qa/node_modules/three qa-vendor
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/qa-server.log 2>&1 &
          NODE_PATH=/tmp/character-qa/node_modules node qa/character-regression.cjs
      - name: Commit tested game files on isolated fix branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add goku-alianzas-z/index.html goku-alianzas-z/juego.html goku-alianzas-z/assets/models/buu/22.mtl qa/character-v2.inc.js
          if ! git diff --cached --quiet; then
            git commit -m 'Fix character loading, materials and skeletal motion [skip ci]'
            git push origin HEAD:chatgpt/character-fixes-v2
          fi
      - name: Collect diagnostic bundle
        if: always()
        run: |
          mkdir -p qa-results/source
          cp goku-alianzas-z/index.html qa-results/source/
          cp /tmp/qa-server.log qa-results/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-regression
          path: qa-results/
          retention-days: 3
